# Baked into the image: every spark-submit / spark-sql sees the Iceberg catalog "lake"
# (same Hadoop catalog and warehouse path the Flink jobs use).
spark.sql.extensions                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type           hadoop
spark.sql.catalog.lake.warehouse      hdfs://namenode:8020/warehouse
spark.sql.session.timeZone            UTC
spark.sql.shuffle.partitions          8
spark.jars.ivy                        /tmp/.ivy2
