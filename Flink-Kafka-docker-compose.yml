# Shared by namenode, datanode and hdfs-init. The apache/hadoop image turns FILE.XML_key=value
# environment variables into core-site.xml / hdfs-site.xml.
x-hdfs-env: &hdfs-env
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-bind-host: 0.0.0.0
  HDFS-SITE.XML_dfs.namenode.name.dir: file:///hadoop/dfs/name
  HDFS-SITE.XML_dfs.datanode.data.dir: file:///hadoop/dfs/data
  HDFS-SITE.XML_dfs.replication: "1"
  HDFS-SITE.XML_dfs.permissions.enabled: "false"
  HDFS-SITE.XML_dfs.namenode.safemode.extension: "0"
  HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"

services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"


  # ---- Lakehouse storage: HDFS (Iceberg Hadoop catalog, warehouse = hdfs://namenode:8020/warehouse) ----
  namenode:
    image: apache/hadoop:3.4.1
    container_name: namenode
    hostname: namenode
    user: root
    # Format the name directory only the first time (the volume is empty), then start the NameNode.
    command:
      - /bin/bash
      - -c
      - "[ -f /hadoop/dfs/name/current/VERSION ] || hdfs namenode -format -nonInteractive -force; exec hdfs namenode"
    ports:
      - "9870:9870"          # web UI: http://localhost:9870  (Utilities -> Browse the file system)
    environment: *hdfs-env
    volumes:
      - hdfs-name:/hadoop/dfs/name

  datanode:
    image: apache/hadoop:3.4.1
    container_name: datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    environment: *hdfs-env
    volumes:
      - hdfs-data:/hadoop/dfs/data

  # One-shot: waits until HDFS is writable, then creates the Bronze and Silver folders and exits.
  hdfs-init:
    image: apache/hadoop:3.4.1
    container_name: hdfs-init
    user: root
    depends_on:
      - namenode
      - datanode
    environment: *hdfs-env
    restart: "no"
    command:
      - /bin/bash
      - -c
      - |
        until hdfs dfsadmin -report 2>/dev/null | grep -q "Live datanodes (1)"; do echo "waiting for the datanode..."; sleep 3; done
        until hdfs dfs -mkdir -p /warehouse/bronze /warehouse/silver; do echo "waiting for the namenode (safe mode)..."; sleep 3; done
        hdfs dfs -chmod -R 777 /warehouse
        hdfs dfs -ls /warehouse
        echo "HDFS ready"


  # ---- Flink ----
  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile
    image: flink-kafka:1.20.5
    container_name: flink-jobmanager
    ports:
      - "8082:8081"
    command: jobmanager
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    environment:
      - HADOOP_USER_NAME=root
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 30 s
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 20
        restart-strategy.fixed-delay.delay: 10 s
    volumes:
      - ./flink-sql:/opt/flink/sql
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints


  taskmanager:
    build:
      context: .
      dockerfile: Dockerfile
    image: flink-kafka:1.20.5
    container_name: flink-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - HADOOP_USER_NAME=root
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 8
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    volumes:
      - ./flink-sql:/opt/flink/sql
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints


volumes:
  hdfs-name:
  hdfs-data:
  flink-checkpoints:
  flink-savepoints:
