name: supply-chain-sic

# Shared by namenode, datanode and hdfs-init. The apache/hadoop image turns FILE.XML_key=value
# environment variables into core-site.xml / hdfs-site.xml.
x-hdfs-env: &hdfs-env
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-bind-host: 0.0.0.0
  HDFS-SITE.XML_dfs.namenode.name.dir: file:///hadoop/dfs/name
  HDFS-SITE.XML_dfs.datanode.data.dir: file:///hadoop/dfs/data
  HDFS-SITE.XML_dfs.replication: "1"
  HDFS-SITE.XML_dfs.permissions.enabled: "false"
  HDFS-SITE.XML_dfs.namenode.safemode.extension: "0"
  HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"

# Shared by generator, bridge and dispatcher. Inside Docker they talk to kafka:29092 (INTERNAL listener).
# Values here win over .env (python-dotenv never overrides an existing variable).
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.app
  image: supply-chain-app:latest
  env_file: .env
  environment:
    BOOTSTRAP: kafka:29092
    DATA_DIR: /data
    PYTHONUNBUFFERED: "1"
  volumes:
    - app-data:/data
  restart: unless-stopped
  stop_signal: SIGINT            # the scripts catch Ctrl+C (SIGINT) and print their summary
  stop_grace_period: 40s

services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s


  # ---- Lakehouse storage: HDFS (Iceberg Hadoop catalog, warehouse = hdfs://namenode:8020/warehouse) ----
  namenode:
    image: apache/hadoop:3.4.1
    container_name: namenode
    hostname: namenode
    user: root
    # Format the name directory only the first time (the volume is empty), then start the NameNode.
    command:
      - /bin/bash
      - -c
      - "[ -f /hadoop/dfs/name/current/VERSION ] || hdfs namenode -format -nonInteractive -force; exec hdfs namenode"
    ports:
      - "9870:9870"          # web UI: http://localhost:9870  (Utilities -> Browse the file system)
    environment: *hdfs-env
    volumes:
      - hdfs-name:/hadoop/dfs/name

  datanode:
    image: apache/hadoop:3.4.1
    container_name: datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    environment: *hdfs-env
    volumes:
      - hdfs-data:/hadoop/dfs/data

  # One-shot: waits until HDFS is writable, then creates the Bronze and Silver folders and exits.
  hdfs-init:
    image: apache/hadoop:3.4.1
    container_name: hdfs-init
    user: root
    depends_on:
      - namenode
      - datanode
    environment: *hdfs-env
    restart: "no"
    command:
      - /bin/bash
      - -c
      - |
        until hdfs dfsadmin -report 2>/dev/null | grep -q "Live datanodes (1)"; do echo "waiting for the datanode..."; sleep 3; done
        until hdfs dfs -mkdir -p /warehouse/bronze /warehouse/silver /warehouse/gold; do echo "waiting for the namenode (safe mode)..."; sleep 3; done
        hdfs dfs -chmod -R 777 /warehouse
        hdfs dfs -ls /warehouse
        echo "HDFS ready"


  # ---- Flink ----
  jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: flink-kafka:1.20.5
    container_name: flink-jobmanager
    ports:
      - "8082:8081"
    command: jobmanager
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    environment:
      - HADOOP_USER_NAME=root
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 30 s
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 20
        restart-strategy.fixed-delay.delay: 10 s
    volumes:
      - ./flink-sql:/opt/flink/sql
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints


  taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: flink-kafka:1.20.5
    container_name: flink-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - HADOOP_USER_NAME=root
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 8
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    volumes:
      - ./flink-sql:/opt/flink/sql
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints


  # ---- Monitoring: Kafka `alerts` -> alert-exporter -> Prometheus -> Grafana ----
  alert-exporter:
    build: ./monitoring/exporter
    container_name: alert-exporter
    depends_on:
      - kafka
    restart: unless-stopped
    environment:
      BOOTSTRAP: kafka:29092
      ALERTS_TOPIC: alerts
      FLEET_SIZE: ${FLEET_SIZE:-30}
    ports:
      - "8000:8000"          # http://localhost:8000/metrics

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    depends_on:
      - alert-exporter
    ports:
      - "9090:9090"          # http://localhost:9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"          # http://localhost:3000  (admin / admin)
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana


  # ---- Gold layer: Spark (jobs are run with `docker exec`, by Airflow) ----
  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: supply-chain-spark:3.5.6
    container_name: supply-chain-spark
    restart: unless-stopped
    command: ["sleep", "infinity"]
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    environment:
      HADOOP_USER_NAME: root
    volumes:
      - ./spark:/opt/spark-jobs


  # ---- Streaming apps (always on). They replace the host scripts started by the old run_all.py ----
  generator:
    <<: *app
    container_name: generator
    command: ["python", "-u", "DataGenerator.py"]
    depends_on:
      kafka:
        condition: service_healthy

  bridge:
    <<: *app
    container_name: bridge
    command: ["python", "-u", "KafkaProducer.py"]
    depends_on:
      - generator

  dispatcher:
    <<: *app
    container_name: dispatcher
    command: ["python", "-u", "Dispatcher.py"]
    depends_on:
      - bridge


  # ---- Orchestration: Airflow = scheduled work only (DAG A platform_guard, DAG B lakehouse_batch) ----
  # Docker Desktop (Windows / macOS) uses the default socket below.
  # Linux: put these two lines in .env
  #     DOCKER_SOCK=/var/run/docker.sock
  #     DOCKER_GID=<output of: stat -c %g /var/run/docker.sock>
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    volumes:
      - airflow-db:/var/lib/postgresql/data

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: supply-chain-airflow:2.10.5
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: supply-chain-demo-secret
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-scheduler:
    image: supply-chain-airflow:2.10.5
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark:
        condition: service_started
    environment: *airflow-env
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - ${DOCKER_SOCK:-/run/host-services/docker.proxy.sock}:/var/run/docker.sock
    restart: unless-stopped

  airflow-webserver:
    image: supply-chain-airflow:2.10.5
    container_name: airflow-webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    ports:
      - "8080:8080"          # http://localhost:8080  (admin / admin)
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    restart: unless-stopped

volumes:
  hdfs-name:
  hdfs-data:
  flink-checkpoints:
  flink-savepoints:
  prometheus-data:
  grafana-data:
  app-data:
  airflow-db:
  airflow-logs:
