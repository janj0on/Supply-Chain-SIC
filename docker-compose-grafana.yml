services:
  grafana:
    image: grafana/grafana:latest
    container_name: supply-chain-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - pipeline

volumes:
  grafana-data:

networks:
  pipeline:
    external: true
    name: supply-chain-sic-kafka-flink_default
